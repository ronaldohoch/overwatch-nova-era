@if (mobile()) {
  <a
    [routerLink]="item().link"
    [class]="mobileClasses()"
    routerLinkActive="text-[#f06314] after:h-2.5"
    [routerLinkActiveOptions]="item().exact ? rlaExact : rlaSubset"
  >
    {{ item().label }}
  </a>
} @else {
  <a
    [routerLink]="item().link"
    [class]="desktopClasses()"
    routerLinkActive="text-[#f06314] after:h-1"
    [routerLinkActiveOptions]="item().exact ? rlaExact : rlaSubset"
  >
    {{ item().label }}
  </a>
}
