@if (mobile()) {
  <a
    [routerLink]="item().link"
    [class]="mobileClasses()"
    routerLinkActive="!text-(--ow-orange-text) after:h-2.5"
    [routerLinkActiveOptions]="item().exact ? rlaExact : rlaSubset"
  >
    {{ item().label }}
  </a>
} @else {
  <a
    [routerLink]="item().link"
    [class]="desktopClasses()"
    routerLinkActive="!text-(--ow-orange-text) after:h-1"
    [routerLinkActiveOptions]="item().exact ? rlaExact : rlaSubset"
  >
    {{ item().label }}
  </a>
}
