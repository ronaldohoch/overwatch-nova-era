<div [class]="containerClass()">
    <div class="text-center md:text-left">
      <div class="text-2xl font-black text-[color:var(--ow-orange)] md:min-w-[120px]">
        {{ time() }}
      </div>

      <div class="text-sm uppercase tracking-widest text-[color:var(--ow-gray-500)]">
        {{ dateLabel() }}
      </div>
    </div>

    <div class="flex-1 md:px-8">
      <div class="text-xl font-bold text-[color:var(--ow-gray-700)]">
        {{ teamsLabel() }}
      </div>

      <div class="text-sm uppercase tracking-widest text-[color:var(--ow-gray-500)]">
        {{ stageLabel() }}
      </div>
    </div>

    <!-- STATUS + AÇÕES -->
    <div class="flex flex-col items-center gap-3 md:items-end md:min-w-[260px]">
      <span [class]="statusClass()">
        {{ statusLabel() }}
      </span>

      <div
        class="flex items-center justify-center gap-2 md:justify-end"
        aria-label="Ações da partida"
      >
        <ng-content select="[owScheduleActions]" />
      </div>
    </div>
  </div>
