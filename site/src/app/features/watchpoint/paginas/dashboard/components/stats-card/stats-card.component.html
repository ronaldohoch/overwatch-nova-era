<div
  class="
    bg-(--ow-white)
    border border-(--ow-gray-200)
    shadow-(--shadow-card)
    overflow-hidden
    transition-all duration-300 ease-in-out
    [clip-path:polygon(5%_0,100%_0,100%_95%,95%_100%,0_100%,0_5%)]
    hover:border-(--ow-orange)
    hover:shadow-(--shadow-card-hover)
    hover:-translate-y-1.25
    p-6
  "
  [class]="customClass()"
>
  <h3 class="text-lg font-bold uppercase tracking-wider text-(--ow-orange) mb-4">
    {{ title() }}
  </h3>

  @if (loading()) {
    <div class="min-h-40 flex items-center justify-center">
      <ow-overwatch-loader
        [size]="'96px'"
        [center]="true"
        [ariaLabel]="'Carregando card de ' + title()"
        [accentColor]="'var(--ow-blue)'"
        [ringColor]="'var(--ow-gray-300)'"
      />
    </div>
  } @else {
    <div class="text-5xl font-black mb-2">
      {{ value() }}
    </div>

    <div class="text-(--ow-gray-500) text-sm">
      {{ subtitle() }}
    </div>

    <div
      class="mt-4 bg-(--ow-gray-200) h-2 rounded-full overflow-hidden"
      role="progressbar"
      [attr.aria-label]="progressAriaLabel()"
      [attr.aria-valuemin]="0"
      [attr.aria-valuemax]="100"
      [attr.aria-valuenow]="progressPct()"
    >
      <div
        class="bg-(--ow-orange) h-full"
        [style.width.%]="progressPct()"
      ></div>
    </div>
  }
</div>
